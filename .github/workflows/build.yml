name: ISO Olusturucu

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodlari Depodan Cek
        uses: actions/checkout@v4

      - name: Gerekli Araclari Yukle
        run: sudo apt-get update && sudo apt-get install -y unzip genisoimage

      - name: ZIP Dosyasini Ac ve ISO Yap
        run: |
          # Yüklediğiniz ZIP dosyasını klasöre çıkarıyoruz
          unzip nexus-os-1.0-arch-1.iso.zip || unzip nexus-os-1.0-arch-1.zip -d extracted_content
          
          # Çıkarılan dosyaları ISO formatında paketliyoruz
          genisoimage -o nexus-os-cikti.iso -R -J extracted_content/

      - name: ISO Dosyasini Artifact Olarak Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: hazir-iso-dosyasi
          path: nexus-os-cikti.iso

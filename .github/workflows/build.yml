name: Nexus ISO Derleyici

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodlari Depodan Cek
        uses: actions/checkout@v4

      - name: Gerekli Araclari ve Bagimliliklari Yukle
        run: |
          sudo apt-get update
          sudo apt-get install -y archiso xorriso squashfs-tools genisoimage dosfstools mtools

      - name: Build Betigini Calistir
        run: |
          # Betiğe çalıştırma izni veriyoruz ve root yetkisiyle çalıştırıyoruz
          chmod +x build-iso.sh
          sudo ./build-iso.sh

      - name: Olusan ISO Dosyasini Bul ve U.iso Yap
        run: |
          # Betik bittikten sonra oluşan .iso uzantılı dosyayı bulup U.iso olarak kopyalıyoruz
          find . -name "*.iso" -exec cp {} U.iso \;
          ls -la U.iso

      - name: ISO Dosyasini Indirilebilir Kaydet (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: U-iso-dosyasi
          path: U.iso

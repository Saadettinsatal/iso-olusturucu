name: Nexus ISO Derleyici

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest # İşlemi doğrudan Arch Linux ortamında çalıştırır

    steps:
      - name: Kodlari Depodan Cek
        uses: actions/checkout@v4

      - name: Sistem Paketlerini Guncelle ve Araclari Yukle
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm archiso xorriso squashfs-tools dosfstools mtools base-devel git

      - name: Build Betigini Calistir
        run: |
          chmod +x build-iso.sh
          ./build-iso.sh

      - name: Olusan ISO Dosyasini Bul ve U.iso Yap
        run: |
          find . -name "*.iso" -exec cp {} U.iso \;
          ls -la U.iso

      - name: ISO Dosyasini Indirilebilir Kaydet (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: U-iso-dosyasi
          path: U.iso

